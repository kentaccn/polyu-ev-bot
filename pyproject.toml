[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyu-ev-bot"
version = "0.2.0"
description = "Telegram menu for PolyU carpark EV charger availability"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
polyu-ev-bot = "polyu_ev_bot.__main__:main"

[tool.setuptools.packages.find]
include = ["polyu_ev_bot*"]
